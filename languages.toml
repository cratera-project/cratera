# ------------------------------------------------------------------------------
# 13. ZIG (Zig 0.14.0 Latest Release)
# ------------------------------------------------------------------------------
[zig]
enabled = true
name = "Zig"
source = "job.zig"
compile = "zig build-exe -O ReleaseFast -femit-bin=/tmp/job {file}"
run = "/tmp/job"
