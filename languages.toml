install = "apt_core"
apt_packages = ["gcc"]
apt_prereqs = ["build-essential", "libc6-dev"]

# ------------------------------------------------------------------------------
# 7. GO (Go 1.24 Latest)
# ------------------------------------------------------------------------------
[go]
enabled = true
name = "Go"
source = "main.go"
compile = "go build -o /tmp/job {file}"
run = "/tmp/job"
test_code = "package main\nimport \"fmt\"\nfunc main() { fmt.Println(\"Go OK\") }"

install = "apt_core"
apt_packages = ["golang-go"]
apt_prereqs = ["build-essential", "libc6-dev"]

# ------------------------------------------------------------------------------
# 8. JAVA (OpenJDK 21 LTS)
# ------------------------------------------------------------------------------
[java]
