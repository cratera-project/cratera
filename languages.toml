install = "curl_tar"
source_url = "https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz"
custom_extract = "mkdir -p /usr/local/zig && tar -xf /tmp/pkg.tar.gz -C /usr/local/zig --strip-components=1 && ln -sfn /usr/local/zig/zig /usr/local/bin/zig"
apt_prereqs = []

# ------------------------------------------------------------------------------
# 14. KOTLIN (Kotlin 2.1 Latest)
# ------------------------------------------------------------------------------
[kotlin]
enabled = true
