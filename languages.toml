# ==============================================================================
# CRATERA DECLARATIVE LANGUAGE MANIFEST (TOP 30 LANGUAGES)
# ==============================================================================
# Single source of truth for all language runtimes, compilers, and microVM tasks.
#
# HOW IT WORKS:
#   1. Set `enabled = true` or `enabled = false` to include/exclude any language.
#   2. Run `./scripts/install.sh` (or `./scripts/build-rootfs.sh`) to rebuild rootfs.ext4.
#
# FOUR WAYS TO INSTALL ANY LANGUAGE:
#   • install = "docker_image"      (Copy from official Docker Hub tags)
#   • install = "curl_tar"          (Download & extract standalone binary archive)
#   • install = "apt_core"          (Install standard Linux package via apt)
#   • install = "docker_image_base" (Use official image as Docker FROM base)
#
# apt_prereqs = [...]                (Extra apt packages needed for headers/libs)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RUST (Edition 2024 / Latest Stable)
# ------------------------------------------------------------------------------
[rust]
enabled = true
name = "Rust"
source = "job.rs"
compile = "rustc --edition 2024 -C panic=abort -C opt-level=2 -C link-arg=-fno-use-linker-plugin -o /tmp/job {file}"
run = "/tmp/job"
is_rust = true
test_code = "fn add(a: i32, b: i32) -> i32 { a + b }"
test_harness = "{{SOLUTION}}\n\nfn main() { assert_eq!(add(2, 3), 5); }"

install = "curl_tar"
source_url = "https://static.rust-lang.org/dist/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz"
tar_strip = 1
install_prefix = "/usr"
install_args = "rustc,rust-std-x86_64-unknown-linux-gnu"
apt_prereqs = ["build-essential", "gcc", "libc6-dev"]

# ------------------------------------------------------------------------------
# 2. PYTHON 3 (Latest Active)
# ------------------------------------------------------------------------------
[python]
enabled = true
name = "Python"
source = "job.py"
run = "python3 {file}"
test_code = "x = 100 + 200\nprint(x)\nassert x == 300"

install = "apt_core"
apt_packages = ["python3", "python3-minimal"]
apt_prereqs = []

# ------------------------------------------------------------------------------
# 3. JAVASCRIPT (Node.js 24 LTS / Current)
# ------------------------------------------------------------------------------
[node]
enabled = true
name = "JavaScript"
source = "job.js"
run = "node {file}"
test_code = "console.log('Node: ' + process.version);"

install = "docker_image"
image = "node:24-bookworm-slim"
copy_paths = ["/usr/local/bin/node"]
apt_prereqs = []

# ------------------------------------------------------------------------------
# 4. TYPESCRIPT (Latest Stable via esbuild)
# ------------------------------------------------------------------------------
[typescript]
enabled = true
name = "TypeScript"
source = "job.ts"
compile = "esbuild {file} --bundle --platform=node --outfile=/tmp/job.js"
run = "node /tmp/job.js"
test_code = "const x: number = 42; console.log(x);"

install = "curl_tar"
source_url = "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.24.0.tgz"
tar_strip = 0
custom_extract = "tar -xzf /tmp/pkg.tar.gz -C /tmp && mv /tmp/package/bin/esbuild /usr/local/bin/esbuild && rm -rf /tmp/package"
apt_prereqs = []

# ------------------------------------------------------------------------------
# 5. C++ (GCC 14 / C++20 / C++23)
# ------------------------------------------------------------------------------
[cpp]
enabled = true
name = "C++"
source = "job.cpp"
compile = "g++ -O3 -std=c++20 -o /tmp/job {file}"
run = "/tmp/job"
test_code = "#include <iostream>\nint main() { std::cout << \"C++ OK\" << std::endl; return 0; }"

install = "apt_core"
apt_packages = ["g++"]
apt_prereqs = ["build-essential", "libc6-dev"]

# ------------------------------------------------------------------------------
# 6. C (GCC 14 / C17 / C23)
# ------------------------------------------------------------------------------
[c]
