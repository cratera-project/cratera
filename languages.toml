install = "curl_tar"
source_url = "https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip"
tar_strip = 1
custom_extract = "unzip -q /tmp/pkg.tar.gz -d /tmp && mv /tmp/kotlinc /usr/local/kotlinc && ln -sfn /usr/local/kotlinc/bin/kotlinc /usr/local/bin/kotlinc && rm -rf /tmp/kotlinc"
