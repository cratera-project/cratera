[workspace]
members = [
    "crates/common",
    "crates/compiler",
    "crates/executor",
    "crates/guest-agent",
    "crates/api",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
authors = ["Rustu <contact@cratera.org>"]
license = "Apache-2.0"
repository = "https://github.com/cratera-project/cratera"
homepage = "https://cratera.org"
documentation = "https://cratera.org"
description = "Hardware-isolated code execution engine powered by Firecracker microVMs."
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
toml = "0.8"
toml_edit = "0.22"
crossterm = "0.28"
nix = { version = "0.29", default-features = false, features = ["mount", "reboot", "fs"] }
vsock = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
