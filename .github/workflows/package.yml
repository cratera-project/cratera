name: Publish Rootfs Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if version already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish-rootfs-package:
    name: Check Version & Publish Rootfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Target Version
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/cratera-rootfs"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2 || echo "1.0.0")
          fi
          
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check If Version Already Built
        id: version_check
        run: |
          TAG_VERSION="${{ steps.meta.outputs.tag_version }}"
          FORCE="${{ github.event.inputs.force }}"
          
          if [[ "$FORCE" == "true" ]]; then
            echo "Force build requested. Building package..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if docker manifest inspect "${TAG_VERSION}" > /dev/null 2>&1; then
            echo "Version ${{ steps.meta.outputs.version }} is already built and published (${TAG_VERSION})."
            echo "No version bump detected. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${{ steps.meta.outputs.version }} is not yet published in GHCR (${TAG_VERSION})."
            echo "New version detected. Building package..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free Disk Space on Runner
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Set up Docker Buildx
        if: steps.version_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Dockerfile from Manifest
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          chmod +x ./scripts/generate-dockerfile.sh
          ./scripts/generate-dockerfile.sh languages.toml Dockerfile.rootfs all

      - name: Build and Push Rootfs Container
        if: steps.version_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rootfs
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_version }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Notification
        if: steps.version_check.outputs.should_build == 'false'
        run: |
          echo "Package ${{ steps.meta.outputs.tag_version }} is already up to date. Build skipped."
