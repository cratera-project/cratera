name: CI

on:
  push:
    branches: [ master, main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    branches: [ master, main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Rust Formatting
        run: cargo fmt --all --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Shell Scripts Lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh examples/*.sh

      - name: Manifest Validation (languages.toml)
        run: |
          python3 -c 'import tomllib; data = tomllib.load(open("languages.toml", "rb")); langs = data.get("languages", data); print(f"Valid TOML: {len(langs)} languages configured")'

  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & contract tests
        run: cargo test --workspace

  security:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cargo Audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Vulnerabilities (cargo audit)
        run: cargo audit

  integration:
    name: KVM In-Guest Hardware Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed microVM-relevant files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vm_relevant:
              - 'crates/**'
              - 'scripts/**'
              - 'languages.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile.rootfs'
              - 'rust-toolchain.toml'

      - name: Install Rust toolchain with musl target
        if: steps.filter.outputs.vm_relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cargo Cache
        if: steps.filter.outputs.vm_relevant == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Enable Host KVM Virtualization
        if: steps.filter.outputs.vm_relevant == 'true'
        run: |
          sudo usermod -aG kvm $USER 2>/dev/null || true
          sudo chown root:kvm /dev/kvm 2>/dev/null || true
          sudo chmod 660 /dev/kvm 2>/dev/null || true
          if [ -e /dev/kvm ]; then
            echo "KVM ready: /dev/kvm accessible"
          else
            echo "Warning: /dev/kvm missing on runner"
          fi

      - name: Fetch Firecracker Runtime & Linux Kernel
        if: steps.filter.outputs.vm_relevant == 'true'
        run: ./scripts/fetch-runtime.sh

      - name: Build Minimal Guest Rootfs (Rust)
        if: steps.filter.outputs.vm_relevant == 'true'
        run: LANGUAGES="minimal" ./scripts/build-rootfs.sh

      - name: Run In-Guest Smoke Test (Hardware MicroVM)
        if: steps.filter.outputs.vm_relevant == 'true'
        run: sg kvm -c './scripts/smoke.sh minimal'

      - name: Skip notice (no microVM-relevant files changed)
        if: steps.filter.outputs.vm_relevant != 'true'
        run: echo "No microVM-relevant files changed — skipping KVM smoke test."

  build:
    name: Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release host coordinator (cratera)
        run: cargo build --release -p cratera

      - name: Build release guest agent (musl static)
        run: cargo build --release -p cratera-guest-agent --target x86_64-unknown-linux-musl
